# Builds the site with the Firebase API key from repository secrets and deploys it to GitHub Pages.
# The key never lives in the repository: locally it comes from .env (git-ignored), here from the
# VITE_FIREBASE_API_KEY secret. Settings → Pages → Source must be "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the Firebase API key secret
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Repository secret VITE_FIREBASE_API_KEY is not set"; exit 1; }

      - name: Build (islands, CSS bundle, service worker manifest)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: npm run build

      - name: Test
        run: npm test

      - name: Assemble the published site (source, tooling and raw materials excluded)
        run: |
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' --exclude '_site/' \
            --exclude 'src/' --exclude 'tools/' --exclude 'tests/' --exclude 'docs/' \
            --exclude 'exam_materials/' --exclude 'books/' --exclude 'dist/' --exclude 'config/*.local*' \
            --exclude '.env*' --exclude '*.md' --exclude 'package*.json' --exclude '*.config.mjs' \
            --exclude 'eslint.config.mjs' --exclude 'jsconfig.json'
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
