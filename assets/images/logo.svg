<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Vermilion to Lacquer Crimson -->
    <linearGradient id="bgGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#D14336"/>
      <stop offset="50%" stop-color="#B32B22"/>
      <stop offset="100%" stop-color="#7A1813"/>
    </linearGradient>

    <!-- Radial ambient light -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF8273" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#B32B22" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>

    <!-- Premium Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8"/>
      <stop offset="40%" stop-color="#E5BA63"/>
      <stop offset="100%" stop-color="#B88228"/>
    </linearGradient>

    <!-- Hanzi Drop Shadow -->
    <filter id="charShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3A0806" flood-opacity="0.48"/>
    </filter>

    <!-- Golden Spark Glow -->
    <filter id="sparkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#centerGlow)"/>

  <!-- Double Golden Filigree Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.55"/>
  <rect x="38" y="38" width="436" height="436" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Subtle Synapse Orbit Nodes in Background -->
  <g opacity="0.14" stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <ellipse cx="256" cy="256" rx="190" ry="90" transform="rotate(-25 256 256)" stroke-width="1.5" stroke-dasharray="8 12"/>
    <ellipse cx="256" cy="256" rx="190" ry="90" transform="rotate(35 256 256)" stroke-width="1.5" stroke-dasharray="8 12"/>
    <circle cx="110" cy="180" r="3.5" fill="#FFFFFF"/>
    <circle cx="395" cy="210" r="3.5" fill="#FFFFFF"/>
    <circle cx="330" cy="385" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Main Character 汉 -->
  <g filter="url(#charShadow)">
    <text x="254" y="356"
          font-family="'PingFang SC', 'Hiragino Sans GB', 'STHeiti', -apple-system, sans-serif"
          font-size="288"
          font-weight="700"
          fill="#FFFFFF"
          text-anchor="middle">汉</text>
  </g>

  <!-- Golden Synapse Star (Cognitive Insight Spark) -->
  <g transform="translate(380, 138)" filter="url(#sparkGlow)">
    <circle cx="0" cy="0" r="18" fill="#FFEAA0" opacity="0.28"/>
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#FFF2B8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#FFF2B8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
