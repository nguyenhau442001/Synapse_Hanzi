<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" data-style="editorial">
  <defs>
    <clipPath id="earthClip">
      <circle cx="120" cy="120" r="70" />
    </clipPath>
  </defs>
  <!-- Editorial Warm Cream Background -->
  <rect width="240" height="240" fill="#F4EDE2" />

  <!-- Subtle Atmosphere Halo -->
  <circle cx="120" cy="120" r="78" fill="#D9E6EC" opacity="0.75" />

  <!-- Tilted Orbit Path (Back) -->
  <ellipse cx="120" cy="120" rx="98" ry="30" fill="none" stroke="#B8A996" stroke-width="1.8" stroke-dasharray="5 5" transform="rotate(-22 120 120)" />

  <!-- Earth Ocean Base -->
  <circle cx="120" cy="120" r="70" fill="#5E97B8" />

  <!-- Clipped Globe Contents -->
  <g clip-path="url(#earthClip)">
    <!-- Soft Ocean Specular Highlight -->
    <circle cx="94" cy="94" r="46" fill="#78AFCF" opacity="0.5" />

    <!-- Continents -->
    <g fill="#6B9E78" stroke="#3A332D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <!-- North America -->
      <path d="M 60 76 C 72 62 96 60 105 71 C 111 78 106 89 98 93 C 91 96 96 103 90 109 C 83 115 73 111 67 102 C 59 92 55 83 60 76 Z" />
      <!-- South America -->
      <path d="M 90 115 C 101 113 111 121 113 133 C 115 145 104 164 96 173 C 90 179 84 170 86 156 C 88 142 82 126 90 115 Z" />
      <!-- Greenland -->
      <path d="M 109 58 C 117 54 127 56 125 64 C 123 70 111 68 109 58 Z" />
      <!-- Eurasia -->
      <path d="M 132 67 C 149 57 175 62 185 78 C 191 88 185 104 175 110 C 167 114 159 108 153 104 C 145 100 135 104 129 96 C 125 88 125 74 132 67 Z" />
      <!-- Africa -->
      <path d="M 131 107 C 145 103 159 109 165 121 C 169 131 161 145 155 157 C 149 167 139 167 135 155 C 131 141 123 129 125 117 C 126 111 127 109 131 107 Z" />
      <!-- Australia / Island -->
      <path d="M 169 139 C 179 135 187 143 183 153 C 179 161 167 159 165 149 C 164 143 166 141 169 139 Z" />
    </g>

    <!-- Polar Ice Caps -->
    <g fill="#FBF6EE" stroke="#3A332D" stroke-width="1.8" stroke-linejoin="round">
      <path d="M 74 58 Q 120 71 166 58 L 166 44 L 74 44 Z" />
      <path d="M 80 182 Q 120 169 160 182 L 160 196 L 80 196 Z" />
    </g>

    <!-- Spherical Crescent Shadow -->
    <path d="M 120 50 A 70 70 0 0 1 120 190 A 48 70 0 0 0 120 50 Z" fill="#2A3E4C" opacity="0.16" />
  </g>

  <!-- Earth Outer Ink Outline -->
  <circle cx="120" cy="120" r="70" fill="none" stroke="#3A332D" stroke-width="3" />

  <!-- Orbiting Moon -->
  <g transform="translate(196, 54)">
    <circle cx="0" cy="0" r="11" fill="#E39A62" stroke="#3A332D" stroke-width="2.5" />
    <circle cx="-3" cy="-2" r="2" fill="#C97E46" />
    <circle cx="3" cy="3" r="1.5" fill="#C97E46" />
  </g>

  <!-- Editorial Sparkle Stars -->
  <path d="M 36 38 L 38.2 44.2 L 44.4 46.4 L 38.2 48.6 L 36 54.8 L 33.8 48.6 L 27.6 46.4 L 33.8 44.2 Z" fill="#E39A62" stroke="#3A332D" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M 42 182 L 43.7 186.7 L 48.4 188.4 L 43.7 190.1 L 42 194.8 L 40.3 190.1 L 35.6 188.4 L 40.3 186.7 Z" fill="#E39A62" stroke="#3A332D" stroke-width="1.6" stroke-linejoin="round" />
  <path d="M 198 172 L 200 177.5 L 205.5 179.5 L 200 181.5 L 198 187 L 196 181.5 L 190.5 179.5 L 196 177.5 Z" fill="#E39A62" stroke="#3A332D" stroke-width="1.8" stroke-linejoin="round" />
  <circle cx="64" cy="34" r="2" fill="#3A332D" opacity="0.6" />
  <circle cx="208" cy="118" r="2" fill="#3A332D" opacity="0.6" />
  <circle cx="26" cy="126" r="1.8" fill="#3A332D" opacity="0.5" />
</svg>
