<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="65%" stop-color="#060B19" />
      <stop offset="100%" stop-color="#03050C" />
    </radialGradient>

    <radialGradient id="atmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="76%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="88%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="94%" stop-color="#7DD3FC" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="oceanGrad" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#3B8EC7" />
      <stop offset="45%" stop-color="#1B5D92" />
      <stop offset="82%" stop-color="#0E345E" />
      <stop offset="100%" stop-color="#071B36" />
    </radialGradient>

    <radialGradient id="terminatorShadow" cx="28%" cy="26%" r="78%">
      <stop offset="45%" stop-color="#020617" stop-opacity="0" />
      <stop offset="75%" stop-color="#020617" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.84" />
    </radialGradient>

    <radialGradient id="limbHighlight" cx="28%" cy="28%" r="65%">
      <stop offset="82%" stop-color="#BAE6FD" stop-opacity="0" />
      <stop offset="96%" stop-color="#BAE6FD" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.52" />
    </radialGradient>

    <filter id="cloudSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
    <filter id="cloudWisp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" />
    </filter>

    <clipPath id="earthClip">
      <circle cx="120" cy="120" r="76" />
    </clipPath>
  </defs>

  <rect width="240" height="240" fill="url(#spaceBg)" />

  <g fill="#FFFFFF">
    <circle cx="26" cy="34" r="0.8" opacity="0.65" />
    <circle cx="52" cy="22" r="0.5" opacity="0.4" />
    <circle cx="194" cy="28" r="0.9" opacity="0.7" />
    <circle cx="216" cy="54" r="0.6" opacity="0.45" />
    <circle cx="18" cy="148" r="0.7" opacity="0.5" />
    <circle cx="34" cy="206" r="0.8" opacity="0.6" />
    <circle cx="212" cy="196" r="0.9" opacity="0.65" />
    <circle cx="182" cy="222" r="0.6" opacity="0.4" />
    <circle cx="88" cy="18" r="0.5" opacity="0.35" />
    <circle cx="224" cy="126" r="0.6" opacity="0.45" />
  </g>

  <circle cx="120" cy="120" r="85" fill="url(#atmGlow)" />
  <circle cx="120" cy="120" r="76" fill="url(#oceanGrad)" />

  <g clip-path="url(#earthClip)">
    <!-- North America with jagged coastline & Gulf -->
    <path d="M 40 72 L 54 63 L 68 60 L 82 62 L 88 69 L 79 75 L 82 81 L 73 86 L 68 93 L 72 99 L 64 103 L 57 98 L 51 102 L 43 94 L 38 82 Z" fill="#46834D" />
    <path d="M 50 74 L 66 68 L 74 75 L 67 83 L 55 82 Z" fill="#8C8B5C" opacity="0.65" />

    <!-- Greenland -->
    <path d="M 92 49 L 103 45 L 113 49 L 111 56 L 102 60 L 94 56 Z" fill="#DCE8EE" />

    <!-- South America -->
    <path d="M 73 114 L 84 113 L 94 119 L 101 129 L 99 139 L 92 149 L 87 161 L 80 174 L 73 177 L 70 166 L 73 151 L 68 136 L 66 123 Z" fill="#3C7D46" />
    <path d="M 72 122 L 77 136 L 77 154 L 73 170 L 76 160 L 79 144 L 76 128 Z" fill="#9E8D62" opacity="0.72" />

    <!-- Europe & Eurasia with Mediterranean/Iberia -->
    <path d="M 121 63 L 132 54 L 152 51 L 172 58 L 188 70 L 194 84 L 185 95 L 173 96 L 164 90 L 156 93 L 148 87 L 140 89 L 134 84 L 126 85 L 120 79 L 124 72 Z" fill="#4C8650" />
    <path d="M 148 74 L 168 73 L 184 82 L 181 92 L 164 90 L 148 84 Z" fill="#B89B6A" opacity="0.75" />

    <!-- Africa & Arabian Peninsula with Horn & Gulf of Guinea -->
    <path d="M 122 93 L 136 91 L 149 95 L 159 96 L 167 104 L 164 111 L 171 116 L 164 128 L 158 142 L 150 157 L 142 162 L 136 153 L 134 139 L 131 128 L 122 122 L 115 114 L 117 101 Z" fill="#437D47" />
    <path d="M 118 99 L 136 93 L 156 97 L 165 107 L 154 116 L 134 117 L 120 113 Z" fill="#C9AB74" />
    <path d="M 137 142 L 148 140 L 152 149 L 144 159 L 137 152 Z" fill="#9E9260" opacity="0.78" />

    <!-- Madagascar -->
    <path d="M 167 142 L 172 140 L 172 151 L 167 156 L 164 148 Z" fill="#46834D" />

    <!-- Polar Ice Caps -->
    <path d="M 76 47 Q 120 55 164 47 L 164 38 L 76 38 Z" fill="#E8F1F5" opacity="0.9" />
    <path d="M 72 189 Q 120 177 168 189 L 168 200 L 72 200 Z" fill="#E2EDF2" opacity="0.88" />

    <!-- Organic Satellite Cloud Masses (Soft Wisps & Weather Systems) -->
    <g fill="#FFFFFF" filter="url(#cloudSoft)">
      <path d="M 48 84 C 64 76 88 80 102 88 C 90 92 66 92 48 84 Z" opacity="0.34" />
      <path d="M 114 112 C 134 104 162 110 178 120 C 160 124 132 120 114 112 Z" opacity="0.32" />
      <path d="M 62 148 C 82 140 106 146 124 156 C 102 158 78 156 62 148 Z" opacity="0.3" />
      <path d="M 136 66 C 154 60 176 68 186 78 C 170 80 150 74 136 66 Z" opacity="0.28" />
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" filter="url(#cloudWisp)">
      <path d="M 56 88 Q 78 82 98 90" stroke-width="2.2" opacity="0.42" />
      <path d="M 122 116 Q 146 112 168 122" stroke-width="2" opacity="0.38" />
      <path d="M 74 152 Q 96 146 116 156" stroke-width="2" opacity="0.36" />
      <path d="M 104 134 Q 118 128 130 134" stroke-width="1.6" opacity="0.34" />
    </g>

    <circle cx="120" cy="120" r="76" fill="url(#limbHighlight)" />
    <circle cx="120" cy="120" r="76" fill="url(#terminatorShadow)" />
  </g>
</svg>
